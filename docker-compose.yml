services:
  backend:
    build: ./backend
    container_name: crm-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:./dev.db
    volumes:
      - crm-data:/app/prisma

  frontend:
    build: ./frontend
    container_name: crm-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  crm-data:
